# Конфіг gitleaks для ПУБЛІЧНОГО репозиторію.
#
# Базу правил беремо стандартну і НЕ звужуємо: єдине, що відділяє секрет від
# світу тут, — цей скан, бо приватність шаром захисту не вважається.
#
# Allowlist нижче описує рівно дві речі: тестові дані, які за побудовою не є
# секретами, і каталог збірки. Кожен рядок — окреме рішення; «щоб не блимало»
# причиною не є.
title = "exo-kit"

[extend]
useDefault = true

[[rules]]
id = "exo-kit-generic-assignment"
description = "Присвоєння схожого на секрет значення у вихідному коді"
regex = '''(?i)(secret|passwd|password|api[_-]?key|token)\s*[:=]\s*['"][A-Za-z0-9+/=_\-]{16,}['"]'''
tags = ["generic"]
[rules.allowlist]
paths = ['''^test/''']
regexTarget = "line"
regexes = [
  # Значення-плейсхолдери в прикладах документації.
  '''(?i)(your|example|placeholder|changeme|<[^>]+>)''',
]

[allowlist]
description = "Тести і збірка"
paths = [
  # Тести підписують запити відомим рядком: без спільного секрета перевірити
  # HMAC неможливо, а сам рядок нічого не відмикає — він і є вхід у тест.
  '''^test/connector-sdk\.test\.ts$''',
  # Вектор RFC 6238 §B — base32 від ASCII "12345678901234567890". Він
  # опублікований у самому стандарті, і саме в цьому його сенс: тест пінить
  # алгоритм до стандарту, а не до себе самого. Він нічого не відмикає.
  '''^test/totp\.test\.ts$''',
  # dist/ — згенерований JS із того самого src/, який уже просканований.
  '''^dist/''',
  '''^package-lock\.json$''',
]
