# АРХЕТИП F1 — конфіг nginx для статики (@exo/kit, templates/docker/static-nginx).
# Кладеться в __SVC_DIR__/nginx.conf. `__APP_VERSION__` — НЕ плейсхолдер
# генератора: його підставляє Dockerfile коротким хешем коміту на збірці.
#
# TLS, заголовки безпеки і стиснення робить Traefik (`secure-headers@file`,
# `compress@file`) — дублювати їх тут означало б два джерела правди про те, як
# продукт виглядає назовні.
server {
    # 8080, а не 80: nginx-unprivileged працює від uid 101, привілейованого порту
    # без root не відкрити. Назовні не видно — Traefik ходить на порт із мітки.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проби стандарту (AGENTS.md §6), JSON {status, version, checks}.
    # /health/live — без залежностей, її б'є HEALTHCHECK. /health/ready перевіряє
    # те єдине, що тут може зламатися, — що збірка справді лягла в образ:
    # віддавати 200 на будь-що не можна (урок exo-vpn). Точний `location =`
    # перемагає фолбек SPA нижче, тож проба не віддасть index.html.
    location = /health/live {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","version":"__APP_VERSION__","checks":{}}';
    }
    location = /health/ready {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if (!-f /usr/share/nginx/html/index.html) {
            return 503 '{"status":"error","version":"__APP_VERSION__","checks":{"build":"missing"}}';
        }
        return 200 '{"status":"ok","version":"__APP_VERSION__","checks":{"build":"ok"}}';
    }

    # SPA (Vite): невідомий шлях → index.html, маршрут вирішує клієнт.
    # Статичний експорт Next кладе роут як `<шлях>.html`, і там інакше — справжній
    # 404 зі статусом 404:
    #   try_files $uri $uri.html $uri/index.html =404;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файли збірки адресуються хешем вмісту (Vite — /assets/, Next — /_next/static/):
    # змінився вміст — змінилось ім'я, отже кешувати їх назавжди безпечно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Сам HTML — ні: інакше після деплою браузер тягне старий бандл до нової сторінки.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
